<template>
    <header class="header">
        <div class="inner">
            <a class="brand" href={homeHref}>
                <template lwc:if={showLogo}>
                    <img class="mark" src={logoUrl} alt={logoAlt} height="60" onerror={hideLogo} />
                </template>
                <span class="brand-title">{siteTitle}</span>
            </a>

            <nav class={navClass} aria-label="Primary">
                <template for:each={links} for:item="link">
                    <template lwc:if={link.hasChildren}>
                        <div key={link.href} class={link.groupCls} onkeydown={handleGroupKey} onfocusout={handleGroupBlur}>
                            <a href={link.href} class={link.cls} aria-current={link.current}>{link.label}</a>
                            <button class="caret" type="button" data-label={link.label} aria-haspopup="true" aria-expanded={link.expanded} aria-controls={link.menuId} aria-label={link.caretLabel} onclick={toggleDropdown}>
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
                            </button>
                            <ul id={link.menuId} class="dropdown">
                                <template for:each={link.children} for:item="sub">
                                    <li key={sub.href}>
                                        <a href={sub.href} class={sub.cls} aria-current={sub.current}>{sub.label}</a>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </template>
                    <template lwc:else>
                        <a key={link.href} href={link.href} class={link.cls} aria-current={link.current}>{link.label}</a>
                    </template>
                </template>
                <div class="nav-actions">
                    <template lwc:if={signedIn}>
                        <span class="account" title={accountTitle}>{accountLabel}</span>
                        <button class="btn btn--secondary btn--sm" type="button" onclick={handleSignOut}>Sign out</button>
                    </template>
                    <template lwc:else>
                        <a href={loginHref} class="btn btn--secondary btn--sm" aria-current={loginCurrent}>Sign in</a>
                        <a href={requestAccountHref} class="btn btn--primary btn--sm" aria-current={requestAccountCurrent}>Request an account</a>
                    </template>
                </div>
            </nav>

            <button class="menu" type="button" onclick={toggleMenu} aria-expanded={menuOpen} aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>
</template>
