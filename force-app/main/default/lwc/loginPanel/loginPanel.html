<template>
    <section class="wrap">
        <div class="container layout">
            <div class="head">
                <p class="eyebrow eyebrow--bar">Licensed customer portal</p>
                <h1 class="title">Sign in to request and track tests</h1>
                <p class="lead">Access is limited to licensed customers and sponsored organizations. If your organization is not yet licensed, request an account and the range office will verify eligibility.</p>
                <p class="switch">New to the portal? <a href={requestAccountHref}>Request an account</a></p>
            </div>

            <form class="card panel" onsubmit={handleSignIn} novalidate>
                <div class="card__body">
                    <h2 class="card__title">Sign in</h2>
                    <p class="card__text">Use the email address on your licensed account.</p>
                    <div class="fields">
                        <div class="field">
                            <label class="label" for="signin-email">Email</label>
                            <input id="signin-email" name="username" class="input" type="email" autocomplete="username" required />
                        </div>
                        <div class="field">
                            <label class="label" for="signin-password">Password</label>
                            <input id="signin-password" name="password" class="input" type="password" autocomplete="current-password" required />
                        </div>
                    </div>
                    <template lwc:if={signInNote}><p class={noteClass} role="status">{signInNote}</p></template>
                    <div class="actions">
                        <button class="btn btn--primary btn--block" type="submit" disabled={signingIn}>{signInLabel}</button>
                        <button class="btn btn--secondary btn--block" type="button" onclick={handleCac}>Sign in with CAC / PIV</button>
                    </div>
                    <button class="small-link" type="button" onclick={handleForgot}>Forgot your password?</button>
                </div>
            </form>
        </div>
    </section>
</template>
